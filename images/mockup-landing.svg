<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="lp-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#lp-bg)"/>

  <!-- barra browser -->
  <rect width="400" height="26" fill="#111c31"/>
  <circle cx="16" cy="13" r="4" fill="#f87171"/>
  <circle cx="30" cy="13" r="4" fill="#fbbf24"/>
  <circle cx="44" cy="13" r="4" fill="#34d399"/>
  <rect x="70" y="7" width="140" height="12" rx="6" fill="#1e293b"/>

  <!-- hero centrato -->
  <rect x="110" y="52" width="180" height="10" rx="5" fill="url(#lp-accent)"/>
  <rect x="90" y="72" width="220" height="16" rx="4" fill="#e2e8f0"/>
  <rect x="120" y="94" width="160" height="8" rx="4" fill="#475569"/>

  <rect x="150" y="116" width="100" height="26" rx="8" fill="url(#lp-accent)"/>

  <!-- 3 feature -->
  <g>
    <circle cx="90" cy="188" r="18" fill="#1e293b" stroke="#334155"/>
    <rect x="70" y="212" width="40" height="6" rx="3" fill="#475569"/>

    <circle cx="200" cy="188" r="18" fill="#1e293b" stroke="#334155"/>
    <rect x="180" y="212" width="40" height="6" rx="3" fill="#475569"/>

    <circle cx="310" cy="188" r="18" fill="#1e293b" stroke="#334155"/>
    <rect x="290" y="212" width="40" height="6" rx="3" fill="#475569"/>
  </g>
</svg>
