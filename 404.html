<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagina non trovata | Cristofer Corrado</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }
    .error-code {
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 800;
      background: linear-gradient(90deg, var(--primary), #7dd3fc, #fff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
    }
    .error-page h1 {
      margin-top: 10px;
      font-size: clamp(1.4rem, 3vw, 2rem);
    }
    .error-page p {
      margin: 18px 0 32px;
      color: var(--text-muted);
      max-width: 480px;
    }
  </style>
</head>
<body>
  <div class="background-grid" aria-hidden="true"></div>
  <div class="glow glow-1" aria-hidden="true"></div>
  <div class="glow glow-2" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <main class="error-page">
    <span class="error-code">404</span>
    <h1>Pagina non trovata</h1>
    <p>La pagina che stai cercando non esiste o è stata spostata. Torna alla home per continuare a esplorare il portfolio.</p>
    <a href="index.html" class="btn btn-primary">
      <i class="fa-solid fa-house"></i>
      Torna alla home
    </a>
  </main>
</body>
</html>
